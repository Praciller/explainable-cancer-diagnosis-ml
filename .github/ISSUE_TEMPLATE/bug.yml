name: Bug report
description: Report a reproducible defect or contract regression.
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including the exact visible error or contract mismatch?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include command, URL/mode, viewport, and smallest reproducible input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the expected behavior as Given / When / Then.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Contract and safety impact
      description: Note ML/data/API/terminology/accessibility/security/deployment impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste exact test output or link screenshots/reports. Remove secrets.
    validations:
      required: true
