version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-frontend:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "scikit-learn"
          - "shap"
          - "torch"
          - "mlflow"
          - "starlette"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      - dependency-name: "@testing-library/jest-dom"
        update-types:
          - version-update:semver-major
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-python:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "mlflow"
        update-types:
          - version-update:semver-major
      - dependency-name: "pytest-cov"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
