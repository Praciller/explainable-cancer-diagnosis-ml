name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check src tests
      - run: python -m pip list --format=json > pip-inventory.json
      - run: ruff check src tests
      - run: python -m pytest
      - run: python -m pytest --cov=src/api --cov=src/artifacts --cov-fail-under=90 --cov-report=term-missing --cov-report=xml:coverage-backend.xml
      - run: python -m compileall -q src tests
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            coverage-backend.xml
            pip-inventory.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format cyclonedx > sbom.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm test -- --coverage
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run build-storybook
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-quality-evidence
          path: |
            frontend/coverage/
            frontend/sbom.json
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e:hosted
        working-directory: frontend
      - run: python -m src.pipeline --seed 42 --mlp-epochs 100
      - run: python -m src.explainability.case_study --check
      - run: |
          python -m uvicorn src.api.main:app --host 127.0.0.1 --port 8000 > api-e2e.log 2>&1 &
          echo $! > api-e2e.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat api-e2e.log
          exit 1
        env:
          FRONTEND_ORIGINS: http://127.0.0.1:4173
      - run: npm run e2e:local
        working-directory: frontend
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            api-e2e.log
          if-no-files-found: ignore

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose config --quiet
